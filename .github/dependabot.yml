# Dependency updates, batched weekly. A release must be 14 days old before it is proposed
# (the project's rule for new versions); security updates are not delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: ["/npm", "/examples/react"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    versioning-strategy: increase
    groups:
      npm:
        patterns: ["*"]
  # bench/ pins the goldens' reference implementations on purpose: no version updates (a limit of 0
  # stops them, security updates still come); a reference is raised in a PR that reruns its golden.
  - package-ecosystem: npm
    directory: /bench
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
