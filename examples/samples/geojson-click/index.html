<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../sample.css">
<script type="importmap">
  {
    "imports": {

</div>
<script type="module" src="./main.js"></script>
</html>
