<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glTF models with sunlight</title>
<meta name="description" content="Place a glTF model at GeoJSON points, turned and scaled by their properties, lit by the sun at the hour you choose, with shadows.">
<link rel="stylesheet" href="../sample.css">
<script type="importmap">
  {
    "imports": {
      "mbt-map": "../node_modules/mbt-map/dist/index.js",
      "mbt-map/3d": "../node_modules/mbt-map/dist/3d.js"
    }
  }
</script>
<div id="map"></div>
<div class="panel">
  <h1>Clock towers</h1>
  <label for="hour">Time <output id="time" for="hour"></output></label>
  <input id="hour" type="range" min="5" max="19" step="0.25" value="9">
</div>
<script type="module" src="./main.js"></script>
</html>
