<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D terrain</title>
<meta name="description" content="Mt Fuji in 3D from GSI's elevation tiles, with hillshade, sky and a slider for the exaggeration.">
<link rel="stylesheet" href="../sample.css">
<script type="importmap">
  {
    "imports": {
      "mbt-map": "../node_modules/mbt-map/dist/index.js",
      "mbt-map/3d": "../node_modules/mbt-map/dist/3d.js",
      "mbt-map/analysis": "../node_modules/mbt-map/dist/analysis.js",
      "mbt-map/data": "../node_modules/mbt-map/dist/data.js",
      "mbt-map/draw": "../node_modules/mbt-map/dist/draw.js",
      "mbt-map/element": "../node_modules/mbt-map/dist/element.js",
      "mbt-map/geodesic": "../node_modules/mbt-map/dist/geodesic.js",
      "mbt-map/search": "../node_modules/mbt-map/dist/search.js",
      "mbt-map/services": "../node_modules/mbt-map/dist/services.js",
      "mbt-map/ui": "../node_modules/mbt-map/dist/ui.js"
    }
  }
</script>
<div id="map"></div>
<div class="panel">
  <h1>Mt Fuji</h1>
  <label for="exaggeration">Exaggeration <output id="value" for="exaggeration">1.5</output></label>
  <input id="exaggeration" type="range" min="1" max="3" step="0.1" value="1.5">
</div>
<script type="module" src="./main.js"></script>
</html>
