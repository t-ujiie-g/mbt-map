<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A classified choropleth</title>
<meta name="description" content="Points counted in a square grid by mbt-map/analysis, classed with classBreaks (jenks, quantile or equal intervals) and colored by a step expression from classStep.">
<link rel="stylesheet" href="../sample.css">
<style>
  #legend { display: grid; grid-template-columns: 16px 1fr; gap: 3px 8px; align-items: center; font-size: 12px; }
  #legend i { width: 16px; height: 12px; border: 1px solid #0002; }
</style>
<script type="importmap">
  {
    "imports": {
      "mbt-map": "../node_modules/mbt-map/dist/index.js",
      "mbt-map/analysis": "../node_modules/mbt-map/dist/analysis.js"
    }
  }
</script>
<div id="map"></div>
<div class="panel">
  <h1>Choropleth</h1>
  <p>Places per 1 km cell.</p>
  <label>Classes by
    <select id="method">
      <option value="jenks">natural breaks (jenks)</option>
      <option value="quantile">quantiles</option>
      <option value="equalInterval">equal intervals</option>
    </select>
  </label>
  <div id="legend"></div>
</div>
<script type="module" src="./main.js"></script>
</html>
