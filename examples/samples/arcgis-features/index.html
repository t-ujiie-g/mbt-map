<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArcGIS features in view</title>
<meta name="description" content="Fetch the features of a public ArcGIS FeatureServer layer for the area in view, again after each move, and draw them as circles.">
<link rel="stylesheet" href="../sample.css">
<script type="importmap">
  {
    "imports": {
      "mbt-map": "../node_modules/mbt-map/dist/index.js",
      "mbt-map/services": "../node_modules/mbt-map/dist/services.js"
    }
  }
</script>
<div id="map"></div>
<div class="panel">
  <h1>USA major cities</h1>
  <p id="status">Zoom in to load the cities.</p>
  <output id="city"></output>
</div>
<script type="module" src="./main.js"></script>
</html>
