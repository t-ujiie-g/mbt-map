<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw and edit shapes</title>
<meta name="description" content="mbt-map/draw's controller wired to buttons: points, lines, polygons, rectangles, geodesic circles, editing in select mode, undo and redo, with the drawn GeoJSON shown live.">
<link rel="stylesheet" href="../sample.css">
<style>
  #geojson { max-height: 35vh; overflow: auto; }
</style>
<script type="importmap">
  {
    "imports": {
      "mbt-map": "../node_modules/mbt-map/dist/index.js",
      "mbt-map/draw": "../node_modules/mbt-map/dist/draw.js",
      "mbt-map/geodesic": "../node_modules/mbt-map/dist/geodesic.js"
    }
  }
</script>
<div id="map"></div>
<div class="panel">
  <h1>Draw</h1>
  <div class="row" id="modes">
    <button data-mode="point">Point</button>
    <button data-mode="linestring">Line</button>
    <button data-mode="polygon">Polygon</button>
    <button data-mode="rectangle">Rectangle</button>
    <button data-mode="circle">Circle</button>
    <button data-mode="select">Select</button>
  </div>
  <div class="row">
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <button id="delete">Delete</button>
    <button id="clear">Clear</button>
  </div>
  <p>Enter finishes a shape, Escape cancels it.</p>
  <pre id="geojson"></pre>
</div>
<script type="module" src="./main.js"></script>
</html>
