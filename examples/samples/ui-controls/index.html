<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map controls in plain DOM</title>
<meta name="description" content="mbt-map/ui's headless controllers drawn with your own markup: zoom buttons, a compass and home button, a scale bar, attribution, and the coordinates under the pointer.">
<link rel="stylesheet" href="../sample.css">
<style>
  .nav { position: absolute; top: 10px; right: 10px; z-index: 1; display: flex; flex-direction: column; border: 1px solid #d5dae2; border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 1px 4px #0002; }
  .nav button { width: 34px; height: 34px; border: 0; border-bottom: 1px solid #e1e5eb; background: #fff; font: 18px/1 system-ui, sans-serif; cursor: pointer; display: grid; place-items: center; }
  .nav button:last-child { border-bottom: 0; }
  .nav button:disabled { color: #b5bcc8; cursor: default; }
  #needle { transition: transform 0.1s; }
  #scale { position: absolute; left: 10px; bottom: 10px; z-index: 1; padding: 0 4px; border: 2px solid #18202d; border-top: 0; background: #fffc; font-size: 11px; text-align: center; }
  #attribution { position: absolute; right: 0; bottom: 0; z-index: 1; padding: 2px 6px; background: #fffc; font-size: 11px; }
</style>
<script type="importmap">
  {
    "imports": {
      "mbt-map": "../node_modules/mbt-map/dist/index.js",
      "mbt-map/analysis": "../node_modules/mbt-map/dist/analysis.js",
      "mbt-map/ui": "../node_modules/mbt-map/dist/ui.js"
    }
  }
</script>
<div id="map"></div>
<div class="panel">
  <h1>Coordinates</h1>
  <output id="coordinates"></output>
</div>
<div class="nav">
  <button id="zoom-in" aria-label="Zoom in">+</button>
  <button id="zoom-out" aria-label="Zoom out">−</button>
  <button id="compass" aria-label="Reset north">
    <svg id="needle" viewBox="0 0 20 20" width="20" height="20"><path d="M10 2 14 10H6Z" fill="#e4572e"/><path d="M10 18 6 10h8Z" fill="#8a94a6"/></svg>
  </button>
  <button id="home" aria-label="Back to the start">⌂</button>
</div>
<div id="scale"></div>
<div id="attribution"></div>
<script type="module" src="./main.js"></script>
</html>
