<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WMTS and WMS layers</title>
<meta name="description" content="Read NASA GIBS's WMTS capabilities, pick a layer from the list and draw it; add coastlines and labels from its WMS.">
<link rel="stylesheet" href="../sample.css">
<script type="importmap">
  {
    "imports": {
      "mbt-map": "../node_modules/mbt-map/dist/index.js",
      "mbt-map/3d": "../node_modules/mbt-map/dist/3d.js",
      "mbt-map/analysis": "../node_modules/mbt-map/dist/analysis.js",
      "mbt-map/data": "../node_modules/mbt-map/dist/data.js",
      "mbt-map/draw": "../node_modules/mbt-map/dist/draw.js",
      "mbt-map/element": "../node_modules/mbt-map/dist/element.js",
      "mbt-map/geodesic": "../node_modules/mbt-map/dist/geodesic.js",
      "mbt-map/search": "../node_modules/mbt-map/dist/search.js",
      "mbt-map/services": "../node_modules/mbt-map/dist/services.js",
      "mbt-map/ui": "../node_modules/mbt-map/dist/ui.js"
    }
  }
</script>
<div id="map"></div>
<div class="panel">
  <h1>NASA GIBS</h1>
  <select id="layer" aria-label="WMTS layer" disabled><option>Reading the capabilities…</option></select>
  <label><input id="wms" type="checkbox"> Coastlines and labels (WMS)</label>
  <p id="status"></p>
</div>
<script type="module" src="./main.js"></script>
</html>
