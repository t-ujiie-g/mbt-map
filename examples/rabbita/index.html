<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mbt-map × rabbita</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #1c2330; --muted: #5d6878; --line: #e2e5ea; --soft: #f4f5f7; --accent: #c8402a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Hiragino Sans", sans-serif; color: var(--ink); background: #fff; }
  #app, .app { height: 100%; }
  .app { display: grid; grid-template-columns: 320px 1fr; }
  .sidebar { overflow-y: auto; padding: 20px 18px; border-right: 1px solid var(--line); background: #fbfbfc; }
  .map { display: block; height: 100%; min-height: 320px; }
  h1 { margin: 0; font-size: 22px; }
  h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .lead { margin: 6px 0 0; color: var(--muted); }
  .panel { margin-top: 18px; }
  button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); color: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cities { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .cities button { display: flex; gap: 8px; align-items: baseline; text-align: left; }
  .cities .native { font-weight: 600; }
  .choice { display: flex; flex-wrap: wrap; gap: 6px; }
  .mono { margin: 0; font-variant-numeric: tabular-nums; }
  .hint { margin: 0; color: var(--muted); }
  #feature .name { display: block; font-size: 18px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .status { margin-top: 18px; color: var(--accent); }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; }
    .map { order: -1; }
    .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
<!-- `npm --prefix bench run examples` installs the packed package into ./node_modules and builds ./app.js
     from the MoonBit app in ./main (moon build, then esbuild --minify). -->
<script type="importmap">
  {
    "imports": {
      "mbt-map": "./node_modules/mbt-map/dist/index.js",
      "mbt-map/element": "./node_modules/mbt-map/dist/element.js"
    }
  }
</script>
<div id="app"></div>
<script type="module" src="./app.js"></script>
